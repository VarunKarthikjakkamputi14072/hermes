name: hermes

services:
  postgres:
    image: postgres:16
    # logical replication so Debezium can tail the WAL for the transactional outbox
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "max_replication_slots=4"
    environment:
      POSTGRES_DB: hermes
      POSTGRES_USER: hermes
      POSTGRES_PASSWORD: hermes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hermes"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=kafka:29092"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy

  # Debezium / Kafka Connect — tails the Postgres WAL and ships outbox rows to Kafka
  connect:
    image: quay.io/debezium/connect:2.7
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: hermes-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # One-shot: waits for Connect + the outbox table, then registers the connector
  connect-init:
    image: curlimages/curl:8.8.0
    restart: "no"
    volumes:
      - ./infra/debezium:/cfg:ro
    entrypoint: ["sh", "-c"]
    command:
      - >
        echo 'waiting for connect...';
        until curl -sf http://connect:8083/ >/dev/null; do sleep 3; done;
        echo 'waiting for order-api (outbox table created)...';
        until curl -sf http://order-api:8080/actuator/health >/dev/null; do sleep 3; done;
        echo 'registering payments outbox connector...';
        curl -s -o /dev/null -w '%{http_code}\n' -X POST http://connect:8083/connectors
        -H 'Content-Type: application/json' -d @/cfg/payments-outbox-connector.json;
        echo 'done (409 = already registered).'
    depends_on:
      connect:
        condition: service_started
      order-api:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  embedding-service:
    build:
      context: .
      dockerfile: embedding-service/Dockerfile
    # set MODEL_NAME (e.g. all-MiniLM-L6-v2) to use a real sentence-transformers
    # model; left empty it serves a deterministic offline embedding
    environment:
      EMBED_DIM: 384
    ports:
      - "8000:8000"

  order-api:
    build:
      context: .
      dockerfile: order-api/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hermes
      DB_USER: hermes
      DB_PASSWORD: hermes
      KAFKA_BOOTSTRAP: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  fulfillment-worker:
    build:
      context: .
      dockerfile: fulfillment-worker/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/hermes
      DB_USER: hermes
      DB_PASSWORD: hermes
      KAFKA_BOOTSTRAP: kafka:29092
      HERMES_WORKER_CONCURRENCY: 3
      # real ingestion path: embed via the Python service, write to shared Qdrant
      HERMES_EMBEDDING_MODE: http
      HERMES_EMBEDDING_HTTP_BASE_URL: http://embedding-service:8000
      HERMES_VECTORSTORE_MODE: qdrant
      HERMES_VECTORSTORE_QDRANT_URL: http://qdrant:6333
      # AI fraud narrator: set NVIDIA_API_KEY in your shell to use real NIM;
      # left empty, the narrator falls back to a deterministic template.
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-api:
        condition: service_started
      embedding-service:
        condition: service_started
      qdrant:
        condition: service_started
    deploy:
      replicas: 1

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  qdrantdata:
